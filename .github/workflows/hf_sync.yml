name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub (excluding .github)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # Create a temporary branch for HF sync
          git checkout -b hf-sync-temp
          
          # Remove .github folder
          git rm -rf .github
          git commit -m "Remove .github for HF sync"
          
          # Push to Hugging Face Space
          git push --force https://Erzer12:$HF_TOKEN@huggingface.co/spaces/Erzer12/AI-Based-Network-Intrusion-Detection-System hf-sync-temp:main
